# Mandate CI (FOUNDATION section 11.1 and 11.9; the Phase 0 done check, section 12).
#
# On Linux and Windows: install, run every part of `npm run check` as its own
# step, then a headless determinism run on each pack. A final job compares the
# two machines' state hashes. Every job ends by printing which steps actually
# ran and how each ended (honest CI): a skipped step says "skipped", never
# passes silently. `tools/test/ci-workflow.test.ts` keeps this file in step
# with the `check` script. Runner images are pinned (decision 0035: upgrades are
# deliberate); move to a new image in a commit of its own.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7
        with:
          # Lane 0.7l: no LFS objects until a build or test needs the art; every CI download counts against the owner's bandwidth.
          lfs: false
          # Lane 0.7l (review): the whole history, so the art check reads every commit pushed, not only the tip.
          fetch-depth: 0

      - id: node
        name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: install
        name: npm ci
        run: npm ci

      - id: typecheck
        name: npm run typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - id: rules
        name: npm run check:rules
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:rules

      # The prototype has a separate dependency tree. Keep its install out of
      # the staged hook's private snapshots, but check the complete desk in CI.
      - id: install_desk
        name: Install browser desk dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm --prefix prototypes/desk ci

      - id: typecheck_desk
        name: Typecheck browser desk
        if: ${{ !cancelled() && steps.install_desk.outcome == 'success' }}
        run: npm run typecheck:desk

      - id: test
        name: npm run test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test -- --reporter=default --reporter=json --outputFile.json=runs/ci/vitest.json

      # 0115: no other test file shares the tick measurement. Keep all three
      # stopwatch files and the existing positive no-skips proof, run serially.
      - id: timing
        name: Wall-clock budget tests without parallel files (Linux)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os == 'ubuntu-24.04' }}
        env:
          MANDATE_TIMING: '1'
        run: npm run test -- packages/cli/test/done-check.test.ts packages/cli/test/planner.test.ts packages/kernel/test/map-performance.test.ts --no-file-parallelism --reporter=default --reporter=json --outputFile.json=runs/ci/timing.json

      - id: no_skips
        name: No test skipped where the timing gate is open (Linux; lane 1.14, from 0086)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os == 'ubuntu-24.04' }}
        run: npx tsx tools/no-skips.ts runs/ci/timing.json

      - id: boundary
        name: npm run check:boundary
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:boundary

      - id: licences
        name: npm run check:licences
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:licences

      - id: decisions
        name: npm run check:decisions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:decisions

      - id: lfs_check
        name: No binary under art/ in plain git, in any commit pushed (lane 0.7l; so a --no-verify commit is caught even once deleted)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx tools/lfs-check.ts --history HEAD

      - id: determinism_seats
        name: Determinism run (seats layer, testbed, a hash every day, replay and resume from day 60)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run run:seats -- testbed 180 --resume-at 60 --label ci-determinism

      - id: determinism_seats_union
        name: Determinism run (seats layer, union-1861 from 5 March 1861, 75 days, replay and resume from day 30)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run run:seats -- union-1861 75 --resume-at 30 --label ci-determinism

      - id: done_check
        name: Phase 0 done check (union-1861 at war for 75 days and the testbed for 120; a hash every day, replay, resume, liveness gate, tick budget)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run run:done-check -- --label ci-determinism

      - id: upload
        name: Upload determinism summaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: determinism-${{ matrix.os }}
          path: runs/ci-determinism/
          if-no-files-found: error

      - name: Steps that ran
        if: ${{ always() }}
        shell: bash
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          NODE: ${{ steps.node.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          RULES: ${{ steps.rules.outcome }}
          INSTALL_DESK: ${{ steps.install_desk.outcome }}
          TYPECHECK_DESK: ${{ steps.typecheck_desk.outcome }}
          TEST: ${{ steps.test.outcome }}
          TIMING: ${{ steps.timing.outcome }}
          NO_SKIPS: ${{ steps.no_skips.outcome }}
          BOUNDARY: ${{ steps.boundary.outcome }}
          LICENCES: ${{ steps.licences.outcome }}
          DECISIONS: ${{ steps.decisions.outcome }}
          LFS_CHECK: ${{ steps.lfs_check.outcome }}
          DET_SEATS: ${{ steps.determinism_seats.outcome }}
          DET_SEATS_UNION: ${{ steps.determinism_seats_union.outcome }}
          DONE_CHECK: ${{ steps.done_check.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          tests="not run"
          if [ -f runs/ci/vitest.json ]; then
            tests=$(node -e "const r=require('./runs/ci/vitest.json');console.log(r.numTotalTests+' tests: '+r.numPassedTests+' passed, '+r.numFailedTests+' failed, '+r.numPendingTests+' skipped, '+r.numTodoTests+' todo, in '+r.numTotalTestSuites+' suites')")
          fi
          {
            echo "### Steps that ran: check (${{ matrix.os }})"
            echo ""
            echo "| step | outcome |"
            echo "|---|---|"
            echo "| checkout | $CHECKOUT |"
            echo "| set up node | $NODE |"
            echo "| npm ci | $INSTALL |"
            echo "| npm run typecheck | $TYPECHECK |"
            echo "| npm run check:rules | $RULES |"
            echo "| install browser desk dependencies | $INSTALL_DESK |"
            echo "| typecheck browser desk | $TYPECHECK_DESK |"
            echo "| npm run test | $TEST ($tests) |"
            echo "| wall-clock budget tests | $TIMING |"
            echo "| no test skipped (Linux) | $NO_SKIPS |"
            echo "| npm run check:boundary | $BOUNDARY |"
            echo "| npm run check:licences | $LICENCES |"
            echo "| npm run check:decisions | $DECISIONS |"
            echo "| no binary under art/ in plain git, in any commit | $LFS_CHECK |"
            echo "| determinism run: seats layer (testbed) | $DET_SEATS |"
            echo "| determinism run: seats layer (union-1861) | $DET_SEATS_UNION |"
            echo "| Phase 0 done check (union-1861 at war, testbed) | $DONE_CHECK |"
            echo "| upload summaries | $UPLOAD |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  determinism:
    name: determinism (Linux vs Windows hashes)
    needs: check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7
        with:
          # Lane 0.7l: no LFS objects (see the check job's checkout).
          lfs: false

      - id: node
        name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: install
        name: npm ci
        run: npm ci

      - id: download
        name: Download both machines' summaries
        uses: actions/download-artifact@v8
        with:
          pattern: determinism-*
          path: ci-results/

      - id: compare
        name: Compare state hashes across machines
        run: npx tsx tools/compare-runs.ts ci-results/determinism-ubuntu-24.04 ci-results/determinism-windows-2025

      - name: Steps that ran
        if: ${{ always() }}
        shell: bash
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          NODE: ${{ steps.node.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          DOWNLOAD: ${{ steps.download.outcome }}
          COMPARE: ${{ steps.compare.outcome }}
        run: |
          {
            echo "### Steps that ran: determinism"
            echo ""
            echo "| step | outcome |"
            echo "|---|---|"
            echo "| checkout | $CHECKOUT |"
            echo "| set up node | $NODE |"
            echo "| npm ci | $INSTALL |"
            echo "| download summaries | $DOWNLOAD |"
            echo "| compare Linux and Windows hashes | $COMPARE |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
